appId: work.21stgen.helmdeck
productName: HelmDeck
directories:
  output: release
# only the Electron shell goes in the asar; the daemon + built UI are shipped as
# plain resources so the app can spawn them (Python daemon, Next standalone server)
files:
  - main.js
  - package.json
extraResources:
  # the Python daemon source (the brain + runner). Secrets and per-user data are
  # NEVER bundled - they are created fresh on the user's machine at first run.
  - from: ../daemon
    to: daemon
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!*.db"
      - "!*.db-*"
      - "!settings.json"
      - "!users.json"
      - "!tracks.json"
      - "!events.jsonl"
      - "!processes.json"
      - "!copilot_log.json"
      - "!copilot_sessions.json"
      - "!plane_links.json"
      - "!recordings/**"
      - "!checkpoints/**"
      - "!.attachments/**"
      - "!.copilot_attachments/**"
  # the single Expo web export (static SPA) that main.js serves locally - one
  # codebase for phone/web/desktop, replacing the old Next.js standalone server.
  - from: ../app/dist
    to: app-dist
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "HelmDeck-Setup-${version}-${arch}.${ext}"
  # the fanned-card mark (tools/make_icon.py) - same glyph as the phone launcher
  icon: assets/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: HelmDeck
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
