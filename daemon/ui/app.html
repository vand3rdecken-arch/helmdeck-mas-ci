<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwarmDeck</title>
<style>
/* ---- design tokens: Plane's system (packages/tailwind-config/variables.css), trimmed ---- */
:root{
  --neutral-white:oklch(1 0 0);--neutral-100:oklch(.9848 .0003 230.66);--neutral-200:oklch(.9696 .0007 230.67);
  --neutral-300:oklch(.9543 .001 230.67);--neutral-400:oklch(.9389 .0014 230.68);--neutral-500:oklch(.9235 .0017 230.69);
  --neutral-600:oklch(.8925 .0024 230.7);--neutral-700:oklch(.8612 .0032 230.71);--neutral-800:oklch(.6668 .0079 230.82);
  --neutral-900:oklch(.6161 .0092 230.87);--neutral-1000:oklch(.5288 .0083 230.88);--neutral-1100:oklch(.4377 .0066 230.87);
  --neutral-1200:oklch(.2378 .0029 230.83);
  --brand-default:oklch(.4799 .1158 242.91);--brand-700:oklch(.6766 .1665 243.91);--brand-300:oklch(.9428 .0341 230.22);--brand-100:oklch(.9847 .0083 236.56);
  --green-700:oklch(.64 .17 149);--amber-600:oklch(.7 .15 60);--red-700:oklch(.583 .2387 28.48);
  --bg-canvas:var(--neutral-300);--bg-surface-1:var(--neutral-white);--bg-surface-2:var(--neutral-100);
  --bg-layer-1:var(--neutral-200);--bg-layer-1-hover:var(--neutral-300);
  --bg-layer-2:var(--neutral-white);--bg-layer-2-hover:var(--neutral-100);
  --bg-transparent-hover:oklch(.1482 .0034 196.79/10%);
  --border-subtle:var(--neutral-400);--border-strong:var(--neutral-600);
  --txt-primary:var(--neutral-1200);--txt-secondary:var(--neutral-1100);--txt-tertiary:var(--neutral-1000);--txt-placeholder:var(--neutral-900);
  --accent:var(--brand-default);--accent-txt:var(--brand-default);
  --ok:var(--green-700);--warn:var(--amber-600);--danger:var(--red-700);
  --ai:#4b8fc9;--human:#a8842d;
  --backdrop:oklch(.1482 .0034 196.79/50%);
  --shadow:0 1px 3px oklch(0 0 0/10%),0 1px 2px oklch(0 0 0/6%);
  --shadow-overlay:0 10px 34px oklch(0 0 0/22%);
}
[data-theme="dark"]{
  --neutral-black:oklch(.1689 .0021 230.81);--neutral-100:oklch(.1932 .002 230.81);--neutral-200:oklch(.2158 .0025 230.82);
  --neutral-300:oklch(.2378 .0029 230.83);--neutral-400:oklch(.2593 .0033 230.84);--neutral-500:oklch(.3011 .0041 230.85);
  --neutral-600:oklch(.3415 .0049 230.86);--neutral-700:oklch(.3999 .0059 230.87);--neutral-800:oklch(.5989 .0096 230.88);
  --neutral-900:oklch(.6835 .0074 230.81);--neutral-1000:oklch(.7655 .0054 230.76);--neutral-1100:oklch(.8455 .0035 230.72);
  --neutral-1200:oklch(.9235 .0017 230.69);--neutral-white:oklch(.9702 0 0);
  --brand-default:oklch(.6311 .1263 238.01);--brand-700:oklch(.7408 .1003 233.89);
  --green-700:oklch(.7 .15 150);--amber-600:oklch(.77 .17 65);--red-700:oklch(.7022 .1892 22.23);
  --bg-canvas:var(--neutral-black);--bg-surface-1:var(--neutral-100);--bg-surface-2:var(--neutral-200);
  --bg-layer-1:var(--neutral-200);--bg-layer-1-hover:var(--neutral-300);
  --bg-layer-2:var(--neutral-300);--bg-layer-2-hover:var(--neutral-400);
  --bg-transparent-hover:oklch(1 0 0/10%);
  --border-subtle:var(--neutral-400);--border-strong:var(--neutral-600);
  --backdrop:oklch(0 0 0/60%);
  --ai:#5b9fd9;--human:#c99b2e;
  --shadow:0 1px 3px oklch(0 0 0/40%);
  --shadow-overlay:0 10px 40px oklch(0 0 0/60%);
}
/* ---- base ---- */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg-canvas);color:var(--txt-primary);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:var(--txt-primary);background:var(--bg-surface-2);
  border:1px solid var(--border-subtle);border-radius:6px;padding:6px 10px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
::placeholder{color:var(--txt-placeholder)}
a{color:var(--accent-txt);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border-subtle);border-radius:4px}

/* ---- app shell: sidebar / header / main (Plane anatomy) ---- */
#app{display:flex;height:100%}
#side{width:220px;flex-shrink:0;background:var(--bg-surface-1);border-right:1px solid var(--border-subtle);
  display:flex;flex-direction:column;padding:10px}
#logo{display:flex;align-items:center;gap:8px;padding:6px 8px 14px;font-weight:600;font-size:14px}
#logo .dot{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;
  color:#fff;font-size:12px;font-weight:700}
.navitem{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;color:var(--txt-secondary);
  font-weight:500;margin-bottom:1px;user-select:none}
.navitem:hover{background:var(--bg-transparent-hover)}
.navitem.active{background:var(--bg-transparent-hover);color:var(--txt-primary)}
.navitem svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#side .sect{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-tertiary);
  padding:14px 8px 5px;font-weight:600}
#side .foot{margin-top:auto;padding:8px;font-size:11.5px;color:var(--txt-tertiary)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#hdr{height:46px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 16px;
  background:var(--bg-surface-1);border-bottom:1px solid var(--border-subtle)}
#hdr .crumb{font-weight:600;font-size:13.5px}
#hdr .sep{color:var(--txt-tertiary)}
#hdr .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:6px;font-weight:500;font-size:12.5px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{color:var(--txt-secondary);border:1px solid var(--border-subtle)}
.btn.ghost:hover{background:var(--bg-transparent-hover)}
#capline{font-size:12px;color:var(--txt-tertiary)}
#capline b{color:var(--txt-primary);font-weight:600}
#layouts{display:inline-flex;border:1px solid var(--border-subtle);border-radius:6px;overflow:hidden}
#layouts .lay{padding:2px 10px;font-size:13px;color:var(--txt-tertiary)}
#layouts .lay:hover{background:var(--bg-transparent-hover)}
#layouts .lay.active{background:var(--bg-transparent-hover);color:var(--txt-primary)}

/* ---- list layout ---- */
.lrow{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--border-subtle);
  cursor:pointer;font-size:12.5px}
.lrow:hover{background:var(--bg-transparent-hover)}
.lrow .lbranch{width:170px;color:var(--txt-tertiary);font-size:11.5px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ltask{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.lgroup{font-size:11.5px;font-weight:600;padding:10px 12px 6px;display:flex;align-items:center;gap:7px}
.lgroup .lcount{font-size:11px;color:var(--txt-tertiary);background:var(--bg-layer-1);border-radius:9px;padding:0 7px;line-height:16px}

/* ---- timeline (gantt) layout ---- */
#gantt{background:var(--bg-surface-1);border:1px solid var(--border-subtle);border-radius:10px;overflow-x:auto}
.g-head{display:flex;border-bottom:1px solid var(--border-subtle);font-size:10.5px;color:var(--txt-tertiary)}
.g-side{width:230px;flex-shrink:0;padding:6px 12px;border-right:1px solid var(--border-subtle);position:sticky;left:0;background:var(--bg-surface-1)}
.g-days{display:flex;flex:1}
.g-day{flex-shrink:0;padding:6px 0;text-align:center;border-right:1px dashed var(--border-subtle)}
.g-row{display:flex;align-items:center;border-bottom:1px solid var(--border-subtle)}
.g-row:hover{background:var(--bg-transparent-hover);cursor:pointer}
.g-row .g-side{font-size:12px;font-weight:500;padding:8px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-track{position:relative;flex:1;height:34px}
.g-bar{position:absolute;top:9px;height:14px;border-radius:7px;min-width:14px}
.g-bar span{position:absolute;left:calc(100% + 7px);top:-2px;font-size:10.5px;color:var(--txt-tertiary);white-space:nowrap}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.6}
#content{flex:1;overflow:auto;padding:14px 16px}

/* ---- kanban ---- */
#board{display:flex;gap:12px;align-items:flex-start;height:100%}
.lane{flex:1;min-width:250px;max-width:340px;display:flex;flex-direction:column;max-height:100%}
.lane-h{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;position:sticky;top:0}
.lane-h .ldot{width:9px;height:9px;border-radius:50%}
.lane-h .lname{font-weight:600;font-size:12.5px}
.lane-h .lcount{font-size:11.5px;color:var(--txt-tertiary);background:var(--bg-layer-1);
  border-radius:9px;padding:0 7px;line-height:17px}
.lane-body{display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding:2px 2px 20px;min-height:120px;border-radius:8px}
.lane.drag .lane-body{outline:2px dashed var(--accent);outline-offset:2px}
.card{background:var(--bg-layer-2);border:1px solid var(--border-subtle);border-radius:8px;
  padding:10px 12px;cursor:pointer;box-shadow:var(--shadow)}
.card:hover{background:var(--bg-layer-2-hover)}
.card .cid{font-size:11px;color:var(--txt-tertiary);font-weight:500;margin-bottom:3px;display:flex;gap:6px;align-items:center}
.card .title{font-weight:500;font-size:13px;line-height:1.4;margin-bottom:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--txt-secondary);
  border:1px solid var(--border-subtle);border-radius:5px;padding:1.5px 7px;background:var(--bg-surface-2)}
.chip .sdot{width:7px;height:7px;border-radius:50%}
.splitbars{margin-top:8px}
.splitbars i{display:block;height:3px;border-radius:2px}
.splitbars .ab{background:var(--ai)}.splitbars .hb{background:var(--human);margin-top:2px}

/* ---- peek panel (Plane's issue peek) ---- */
#backdrop{position:fixed;inset:0;background:var(--backdrop);display:none;z-index:9}
#peek{position:fixed;top:0;right:0;bottom:0;width:min(620px,94vw);background:var(--bg-surface-1);
  border-left:1px solid var(--border-subtle);box-shadow:var(--shadow-overlay);transform:translateX(102%);
  transition:transform .18s ease;z-index:10;display:flex;flex-direction:column}
#peek.open{transform:none}
#peek .ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-subtle)}
#peek .ph .pid{font-size:12px;color:var(--txt-tertiary);font-weight:600}
#peek .ph .x{margin-left:auto;color:var(--txt-tertiary);font-size:16px;padding:2px 8px;border-radius:6px}
#peek .ph .x:hover{background:var(--bg-transparent-hover)}
#peek .ptitle{font-size:16px;font-weight:600;padding:14px 16px 6px;line-height:1.4}
#props{display:grid;grid-template-columns:110px 1fr;gap:7px 12px;padding:10px 16px 14px;
  font-size:12.5px;border-bottom:1px solid var(--border-subtle)}
#props .k{color:var(--txt-tertiary)}
#feed{flex:1;overflow-y:auto;padding:12px 16px;font-size:12.5px}
.f-steer{color:var(--txt-primary);background:var(--bg-layer-1);border-radius:8px;padding:7px 11px;margin:8px 0 4px;font-weight:500}
.f-steer::before{content:"you";display:block;font-size:10.5px;color:var(--txt-tertiary);font-weight:600;margin-bottom:2px}
.f-reply{white-space:pre-wrap;padding:4px 2px 10px;color:var(--txt-secondary)}
.f-note{position:relative;font-size:11.5px;color:var(--txt-tertiary);padding:6px 0 6px 20px}
.f-note::before{content:"";position:absolute;left:5px;top:12px;width:7px;height:7px;border-radius:50%;
  background:var(--border-strong)}
.f-note::after{content:"";position:absolute;left:8px;top:20px;bottom:-8px;width:1px;background:var(--border-subtle)}
.f-note:last-child::after{display:none}
#steer-row{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border-subtle)}
#steer-box{flex:1;resize:none;height:60px}

/* ---- new issue modal ---- */
#modal{position:fixed;inset:0;background:var(--backdrop);display:none;place-items:start center;z-index:20;padding-top:12vh}
#modal.open{display:grid}
#mcard{width:min(560px,92vw);background:var(--bg-surface-1);border:1px solid var(--border-subtle);
  border-radius:12px;box-shadow:var(--shadow-overlay);padding:16px}
#mcard h3{margin:0 0 12px;font-size:14px}
#mcard .row{display:flex;gap:8px;margin-bottom:10px}
#mcard input,#mcard textarea{width:100%}
#mcard textarea{height:74px;resize:vertical}
#mcard .adv{font-size:11.5px;color:var(--txt-tertiary);margin:2px 0 10px;cursor:pointer;user-select:none}
#mcard .advrow{display:none}#mcard .advrow.show{display:flex}
#mcard .foot{display:flex;justify-content:flex-end;gap:8px}

/* ---- dashboard view ---- */
#tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--bg-surface-1);border:1px solid var(--border-subtle);border-radius:10px;padding:13px 15px}
.tile .v{font-size:22px;font-weight:700}.tile .l{font-size:11.5px;color:var(--txt-tertiary);margin-top:2px}
.panel{background:var(--bg-surface-1);border:1px solid var(--border-subtle);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-tertiary)}
.meter{background:var(--bg-layer-1);border-radius:6px;height:12px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--human);border-radius:6px}
.hbar{display:flex;align-items:center;gap:10px;margin:5px 0}
.hbar .lbl{width:280px;text-align:right;font-size:12px;color:var(--txt-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .trk{flex:1}.hbar .trk i{display:block;height:11px;border-radius:0 4px 4px 0;background:var(--ai)}
.hbar .n{width:26px;font-size:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--border-subtle)}
th{color:var(--txt-tertiary);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.msplit{display:inline-block;width:90px;vertical-align:middle}
.msplit i{display:block;height:3px;border-radius:2px}

/* ---- recordings view ---- */
.run{background:var(--bg-surface-1);border:1px solid var(--border-subtle);border-radius:10px;margin-bottom:12px;overflow:hidden}
.run-h{display:flex;align-items:center;gap:10px;padding:11px 15px;cursor:pointer}
.run-h:hover{background:var(--bg-transparent-hover)}
.run-h .rt{font-weight:600;font-size:13px}
.run-h .rm{font-size:11.5px;color:var(--txt-tertiary)}
.run-h .rkind{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  border:1px solid var(--border-subtle);border-radius:5px;padding:1px 7px;color:var(--txt-secondary)}
.run-h .chev{margin-left:auto;color:var(--txt-tertiary);transition:transform .15s}
.run.open .chev{transform:rotate(90deg)}
.run-body{display:none;border-top:1px solid var(--border-subtle);padding:12px 15px}
.run.open .run-body{display:block}
.steps{margin:0 0 12px;padding:0;list-style:none;max-height:300px;overflow-y:auto}
.steps li{display:flex;gap:10px;padding:3px 8px;border-left:2px solid var(--border-subtle);
  font-size:12px;color:var(--txt-secondary)}
.steps li.flag{border-left-color:var(--warn);background:color-mix(in oklch,var(--warn) 8%,transparent);color:var(--txt-primary)}
.steps .st{color:var(--txt-tertiary);font-variant-numeric:tabular-nums;flex-shrink:0;width:46px}
.steps .sk{color:var(--txt-tertiary);flex-shrink:0;width:52px}
.run video{max-width:100%;border-radius:8px;border:1px solid var(--border-subtle);background:#000}

/* ---- settings view ---- */
#settings .panel{max-width:620px}
#settings label{display:block;font-size:11.5px;color:var(--txt-tertiary);margin:10px 0 3px}
#settings input{width:100%}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bg-surface-1);
  border:1px solid var(--accent);color:var(--txt-primary);padding:9px 18px;border-radius:8px;display:none;
  box-shadow:var(--shadow-overlay);z-index:30;max-width:80vw;font-size:12.5px}
@media(max-width:760px){#side{display:none}}
</style>
</head>
<body>
<div id="app">
  <nav id="side">
    <div id="logo"><span class="dot">S</span> SwarmDeck</div>
    <div class="navitem" data-view="board"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="11" rx="1.5"/></svg>Board</div>
    <div class="navitem" data-view="dash"><svg viewBox="0 0 24 24"><path d="M3 12h5l2-7 4 14 2-7h5"/></svg>Dashboard</div>
    <div class="navitem" data-view="recs"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>Recordings</div>
    <div class="navitem" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>Settings</div>
    <div class="sect">Views</div>
    <div class="navitem" data-filter="all">All work</div>
    <div class="navitem" data-filter="needs_you">Needs you</div>
    <div class="foot">
      <div id="whoami" style="margin-bottom:6px"></div>
      <span id="themebtn" style="cursor:pointer">◐ theme</span> ·
      <span onclick="signOut()" style="cursor:pointer">sign out</span>
    </div>
  </nav>
  <div id="main">
    <div id="hdr">
      <span class="crumb" id="crumb">Board</span>
      <span id="layouts">
        <button class="lay" data-lay="board" title="Board">▦</button><button class="lay" data-lay="list" title="List">☰</button><button class="lay" data-lay="timeline" title="Timeline">⧖</button>
      </span>
      <span class="sep" id="capsep">·</span><span id="capline"></span>
      <span class="spacer"></span>
      <button class="btn primary" id="newbtn" onclick="openModal()">+ New request</button>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="backdrop" onclick="closePeek()"></div>
<div id="peek">
  <div class="ph"><span class="pid" id="p-id"></span><button class="x" onclick="closePeek()">✕</button></div>
  <div class="ptitle" id="p-title"></div>
  <div id="props"></div>
  <div id="feed"></div>
  <div id="steer-row">
    <textarea id="steer-box" placeholder="Steer this session — context continues, no rebuild"></textarea>
    <button class="btn primary" onclick="sendSteer()">Send</button>
  </div>
</div>

<div id="modal"><div id="mcard">
  <h3>New request</h3>
  <div id="m-examples" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"></div>
  <textarea id="m-task" placeholder="What needs doing — that's all that's required. Repo comes from your preset."></textarea>
  <div class="row" style="align-items:center">
    <select id="m-priority" style="width:130px">
      <option value="urgent">urgent</option><option value="high">high</option>
      <option value="medium" selected>medium</option><option value="low">low</option>
    </select>
    <input id="m-due" type="date" style="width:150px" title="due date">
    <span style="font-size:11px;color:var(--txt-tertiary)">priority · due date</span>
  </div>
  <div id="m-followup" style="display:none;border:1px solid var(--warn);border-radius:8px;padding:9px 12px;margin-bottom:10px;font-size:12px"></div>
  <div class="adv" onclick="document.querySelectorAll('.advrow').forEach(function(r){r.classList.toggle('show')})">▸ advanced (repo / branch / value)</div>
  <div class="row advrow"><input id="m-repo" placeholder="repo path (default preset used if empty)"></div>
  <div class="row advrow"><input id="m-branch" placeholder="branch (auto from task if empty)"><input id="m-value" placeholder="value €" style="width:110px"></div>
  <div class="row advrow"><select id="m-driver" style="flex:1"><option value="claude">driver: claude (code only)</option></select></div>
  <div class="foot"><button class="btn ghost" onclick="closeModal()">Cancel</button>
  <button class="btn primary" onclick="fileReq()">File to Backlog</button></div>
</div></div>
<div id="toast"></div>

<script>
"use strict";
var LANES=[["backlog","Backlog","var(--txt-tertiary)"],["working","Working","var(--ai)"],
           ["review","Review","var(--human)"],["done","Done","var(--ok)"]];
var STATUS={queued:["Queued","var(--txt-tertiary)"],running:["Running","var(--ai)"],
            needs_you:["Needs you","var(--warn)"],submitted:["Submitted","var(--human)"],
            accepted:["Accepted","var(--ok)"],bounced:["Bounced","var(--danger)"]};
var tracks=[],met=null,cur=null,view="board",filter="all";
function $(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function toast(m,ms){var t=$('toast');t.textContent=m;t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},ms||2600)}
var TOKEN='';try{TOKEN=localStorage.sdToken||''}catch(e){}   // device-token fallback (glasses/APK style)
var ME=null;
function fetchJSON(u,opt){
  opt=opt||{};opt.headers=opt.headers||{};
  if(TOKEN)opt.headers['Authorization']='Bearer '+TOKEN;
  return fetch(u,opt).then(function(r){
    if(r.status===401){authGate();throw new Error('auth')}
    return r.json()})}
var authOpen=false;
function authGate(){
  if(authOpen||document.getElementById('authmodal'))return;
  authOpen=true;
  fetch('/auth/state').then(function(r){return r.json()}).then(function(st){
    var setup=st.setup_needed;
    var d=document.createElement('div');d.id='authmodal';
    d.style.cssText='position:fixed;inset:0;background:var(--bg-canvas);display:grid;place-items:center;z-index:40';
    d.innerHTML='<div style="background:var(--bg-surface-1);border:1px solid var(--border-subtle);border-radius:14px;padding:26px;width:min(380px,90vw)">'
      +'<div style="display:flex;align-items:center;gap:9px;margin-bottom:14px"><span style="width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px">S</span><b style="font-size:15px">SwarmDeck</b></div>'
      +(setup?'<h3 style="margin:0 0 4px;font-size:14px">Create the owner account</h3>'
        +'<div style="font-size:12px;color:var(--txt-tertiary);margin-bottom:12px">First run — this account manages everything, including other users.</div>'
       :'<div style="display:flex;gap:14px;margin-bottom:12px;font-size:13px;font-weight:600">'
        +'<span id=tab-in style="cursor:pointer;border-bottom:2px solid var(--accent);padding-bottom:3px">Sign in</span>'
        +(st.registration?'<span id=tab-up style="cursor:pointer;color:var(--txt-tertiary);padding-bottom:3px">Create account</span>':'')
        +'</div>')
      +'<input id=a-name style="width:100%;margin-bottom:8px" placeholder="username" autocomplete=username>'
      +'<input id=a-pw type=password style="width:100%" placeholder="password'+(setup?' (min 8 chars)':'')+'" autocomplete='+(setup?'new-password':'current-password')+'>'
      +'<input id=a-invite style="width:100%;margin-top:8px;display:none" placeholder="invite code">'
      +'<div id=a-err style="font-size:12px;color:var(--danger);margin-top:8px;min-height:16px"></div>'
      +'<button class="btn primary" id=a-go style="width:100%;justify-content:center;padding:8px">'+(setup?'Create & sign in':'Sign in')+'</button></div>';
    document.body.appendChild(d);
    var mode=setup?'setup':'in';
    function setMode(m){mode=m;
      d.querySelector('#a-invite').style.display=(m==='up'&&!st.registration_open)?'':'none';
      d.querySelector('#a-go').textContent=m==='up'?'Create account':'Sign in';
      d.querySelector('#a-pw').placeholder=m==='up'?'password (min 8 chars)':'password';
      if(d.querySelector('#tab-in')){
        d.querySelector('#tab-in').style.cssText='cursor:pointer;padding-bottom:3px;'+(m==='in'?'border-bottom:2px solid var(--accent)':'color:var(--txt-tertiary)');
        if(d.querySelector('#tab-up'))d.querySelector('#tab-up').style.cssText='cursor:pointer;padding-bottom:3px;'+(m==='up'?'border-bottom:2px solid var(--accent)':'color:var(--txt-tertiary)');
      }}
    if(d.querySelector('#tab-in'))d.querySelector('#tab-in').addEventListener('click',function(){setMode('in')});
    if(d.querySelector('#tab-up'))d.querySelector('#tab-up').addEventListener('click',function(){setMode('up')});
    function go(){
      var url=mode==='setup'?'/auth/setup':mode==='up'?'/auth/register':'/auth/login';
      fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:d.querySelector('#a-name').value.trim(),
                             password:d.querySelector('#a-pw').value,
                             invite:d.querySelector('#a-invite').value.trim()})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
      .then(function(res){
        if(!res.ok){d.querySelector('#a-err').textContent=res.j.error||'failed';return}
        d.remove();authOpen=false;ME=null;load()});
    }
    d.querySelector('#a-go').addEventListener('click',go);
    d.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
    d.querySelector('#a-name').focus();
  });
}
function signOut(){
  fetch('/auth/logout',{method:'POST'}).then(function(){
    try{delete localStorage.sdToken}catch(e){}TOKEN='';ME=null;location.reload()})}

function load(){
  var q=[fetchJSON('/tracks'),
         fetchJSON('/dashboard/data').catch(function(){return null}),
         ME?Promise.resolve(ME):fetchJSON('/me').catch(function(){return null})];
  Promise.all(q).then(function(rs){
    tracks=rs[0];met=rs[1];ME=rs[2];
    if(ME)$('whoami').innerHTML='<b style="color:var(--txt-secondary)">'+esc(ME.name)+'</b> · '+esc(ME.role);
    // role-based nav: clients get board only. Set explicitly BOTH ways so
    // switching accounts in the same tab restores the items.
    var isClient=ME&&ME.role==='client';
    document.querySelectorAll('.navitem[data-view="dash"],.navitem[data-view="settings"]')
      .forEach(function(n){n.style.display=isClient?'none':''});
    if(isClient&&(view==='dash'||view==='settings')){view='board';location.hash='board'}
    renderCap();
    // recordings view is interactive (expanded runs, playing video) - don't re-render it on poll
    if(view!=='recs'||!document.querySelector('.run'))render();}).catch(function(){});
}
function econOf(t){if(!met)return null;var c=null;met.cards.forEach(function(x){if(x.id===t.id)c=x});return c}
function renderCap(){
  if(!met){$('capline').textContent=ME?ME.name+' · client view':'';return}
  var c=met.capacity;
  $('capline').innerHTML='<b>'+c.wip+'/'+c.wip_limit+'</b> WIP · '+c.touches_today+'/'+c.touch_budget_day
    +' touches · headroom <b>'+c.headroom+'</b>';
}

/* ---------- board ---------- */
function render(){
  document.querySelectorAll('.navitem[data-view]').forEach(function(n){
    n.classList.toggle('active',n.dataset.view===view)});
  document.querySelectorAll('.navitem[data-filter]').forEach(function(n){
    n.classList.toggle('active',view==='board'&&n.dataset.filter===filter)});
  var isWork=(view==='board'||view==='list'||view==='timeline');
  document.querySelector('.navitem[data-view="board"]').classList.toggle('active',isWork);
  $('crumb').textContent=isWork?'Board':view==='dash'?'Dashboard':view==='recs'?'Recordings':'Settings';
  $('newbtn').style.display=isWork?'':'none';
  $('layouts').style.display=isWork?'':'none';
  document.querySelectorAll('.lay').forEach(function(l){l.classList.toggle('active',l.dataset.lay===view)});
  if(view==='board')renderBoard();else if(view==='list')renderList();
  else if(view==='timeline')renderTimeline();else if(view==='dash')renderDash();
  else if(view==='recs')renderRecs();else renderSettings();
}
function laneColor(l){var c={backlog:'var(--txt-tertiary)',working:'var(--ai)',review:'var(--human)',done:'var(--ok)'};return c[l]||c.backlog}
var PRIO={urgent:['⚠ urgent','var(--danger)'],high:['↑ high','var(--warn)'],medium:['− med','var(--txt-tertiary)'],low:['↓ low','var(--txt-tertiary)']};
var PRIO_ORD={urgent:0,high:1,medium:2,low:3};
function prioChip(t){
  var p=PRIO[t.priority||'medium'];
  return (t.priority&&t.priority!=='medium')?'<span class=chip style="color:'+p[1]+'">'+p[0]+'</span>':'';}
function dueChip(t){
  if(!t.due)return '';
  var overdue=t.lane!=='done'&&t.due<new Date().toISOString().slice(0,10);
  return '<span class=chip'+(overdue?' style="color:var(--danger);border-color:var(--danger)"':'')
    +' title="due date">📅 '+esc(t.due.slice(5))+(overdue?' overdue':'')+'</span>';}

/* ---------- list layout (Plane's spreadsheet-ish list, grouped by lane) ---------- */
function renderList(){
  var h='<div class=panel style="padding:0">';
  LANES.forEach(function(L){
    var inLane=tracks.filter(function(t){return (t.lane||'working')===L[0]});
    if(!inLane.length)return;
    h+='<div class=lgroup><span class=ldot style="background:'+L[2]+';width:8px;height:8px;border-radius:50%;display:inline-block"></span>'
      +L[1]+'<span class=lcount>'+inLane.length+'</span></div>';
    inLane.forEach(function(t){
      var st=STATUS[t.status]||[t.status,'var(--txt-tertiary)'];var e=econOf(t);
      h+='<div class=lrow data-id="'+t.id+'"><span class=lbranch>'+esc(t.branch)+'</span>'
        +'<span class=ltask>'+esc(t.task)+'</span>'
        +'<span class=chip><span class=sdot style="background:'+st[1]+'"></span>'+st[0]+'</span>'
        +(e?'<span class=chip>€'+e.value+'</span><span class=chip>AI $'+e.ai_cost.toFixed(2)+'</span>'
           +'<span class=chip>'+e.touches+'t</span>':'')
        +'<span style="font-size:11px;color:var(--txt-tertiary);width:118px;text-align:right">'+esc(t.updated||'')+'</span></div>';
    });
  });
  h+='</div>';
  $('content').innerHTML=h;
  document.querySelectorAll('.lrow').forEach(function(r){
    r.addEventListener('click',function(){
      var t=tracks.filter(function(x){return x.id===r.dataset.id})[0];if(t)openPeek(t)})});
}

/* ---------- timeline layout (Plane's gantt: card = bar from filed to last activity) ---------- */
function parseTs(s){return s?new Date(s.replace(' ','T')).getTime():null}
function renderTimeline(){
  var now=Date.now(),DAY=86400e3;
  var ts=tracks.map(function(t){return {t:t,a:parseTs(t.created)||now,
    b:(t.lane==='done'?parseTs(t.updated):now)||now,
    due:t.due?parseTs(t.due+' 23:59:59'):null}});
  if(!ts.length){$('content').innerHTML='<div class=panel>no work yet</div>';return}
  var min=Math.min.apply(null,ts.map(function(x){return x.a})),max=Math.max(now,
    Math.max.apply(null,ts.map(function(x){return Math.max(x.b,x.due||0)})));
  var d0=new Date(min);d0.setHours(0,0,0,0);min=d0.getTime();
  var days=Math.max(1,Math.ceil((max-min)/DAY)),pxday=Math.max(64,Math.floor(900/days));
  var W=days*pxday;
  function x(t){return Math.round((t-min)/DAY*pxday)}
  var head='<div class=g-head><div class=g-side>card</div><div class=g-days style="width:'+W+'px">';
  for(var i=0;i<days;i++){var d=new Date(min+i*DAY);
    head+='<div class=g-day style="width:'+pxday+'px">'+(d.getMonth()+1)+'/'+d.getDate()+'</div>'}
  head+='</div></div>';
  var rows=ts.map(function(r){
    var t=r.t,l=x(r.a),w=Math.max(14,x(r.b)-l);
    var lateness=r.due&&t.lane!=='done'&&now>r.due;
    return '<div class=g-row data-id="'+t.id+'"><div class=g-side title="'+esc(t.task)+'">'+esc(t.task)+'</div>'
      +'<div class=g-track style="width:'+W+'px"><div class=g-today style="left:'+x(now)+'px"></div>'
      +(r.due?'<div title="due '+esc(t.due)+'" style="position:absolute;left:'+(x(r.due)-5)+'px;top:11px;width:10px;height:10px;transform:rotate(45deg);background:'
        +(lateness?'var(--danger)':'var(--txt-tertiary)')+'"></div>':'')
      +'<div class=g-bar style="left:'+l+'px;width:'+w+'px;background:'+laneColor(t.lane)+'" title="'
      +esc(t.branch)+' · '+t.lane+'"><span>'+esc(t.branch)+' · '+t.lane
      +(lateness?' · <b style="color:var(--danger)">overdue</b>':'')+'</span></div></div></div>';
  }).join('');
  $('content').innerHTML='<div id=gantt>'+head+rows+'</div>'
    +'<div style="margin-top:10px;font-size:11.5px;color:var(--txt-tertiary)">bar = filed → last activity (done cards freeze at acceptance) · '
    +'<span style="color:var(--ai)">■</span> working · <span style="color:var(--human)">■</span> review · '
    +'<span style="color:var(--ok)">■</span> done · blue line = now</div>';
  document.querySelectorAll('.g-row').forEach(function(r){
    r.addEventListener('click',function(){
      var t=tracks.filter(function(x){return x.id===r.dataset.id})[0];if(t)openPeek(t)})});
}
function renderBoard(){
  var host=$('content');host.innerHTML='<div id=board></div>';
  var b=host.firstChild;
  var maxA=0.01,maxH=1;
  if(met)met.cards.forEach(function(x){if(x.ai_cost>maxA)maxA=x.ai_cost;if(x.touches>maxH)maxH=x.touches});
  LANES.forEach(function(L){
    var lane=document.createElement('div');lane.className='lane';lane.dataset.lane=L[0];
    var inLane=tracks.filter(function(t){return (t.lane||'working')===L[0]
      &&(filter!=='needs_you'||t.status==='needs_you'||t.status==='bounced')});
    if(L[0]==='backlog')inLane.sort(function(a,b){
      return (PRIO_ORD[a.priority||'medium']-PRIO_ORD[b.priority||'medium'])
        ||((a.due||'9999')<(b.due||'9999')?-1:1)});
    lane.innerHTML='<div class=lane-h><span class=ldot style="background:'+L[2]+'"></span>'
      +'<span class=lname>'+L[1]+'</span><span class=lcount>'+inLane.length+'</span></div>'
      +'<div class=lane-body></div>';
    var body=lane.lastChild;
    inLane.forEach(function(t){
      var st=STATUS[t.status]||[t.status,'var(--txt-tertiary)'];
      var e=econOf(t);
      var c=document.createElement('div');c.className='card';c.draggable=true;
      c.innerHTML='<div class=cid>'+esc(t.branch)+' · '+t.turns+' turns</div>'
        +'<div class=title>'+esc(t.task)+'</div>'
        +'<div class=chips><span class=chip><span class=sdot style="background:'+st[1]+'"></span>'+st[0]+'</span>'
        +prioChip(t)+dueChip(t)
        +(t.driver&&t.driver!=='claude'?'<span class=chip title="execution driver" style="color:var(--accent-txt)">🖥 '+esc(t.driver)+'</span>':'')
        +(e?'<span class=chip title="deliverable value">€'+e.value+'</span>'
           +'<span class=chip title="AI cost so far">AI $'+e.ai_cost.toFixed(2)+'</span>'
           +'<span class=chip title="your touch units">'+e.touches+'t</span>'
           +(e.mode?'<span class=chip>'+e.mode+'</span>':''):'')
        +'</div>'
        +(e&&(e.ai_cost>0||e.touches>0)?'<div class=splitbars title="AI $ (top) vs human touches (bottom)">'
          +'<i class=ab style="width:'+Math.max(2,Math.round(100*e.ai_cost/maxA))+'%"></i>'
          +'<i class=hb style="width:'+Math.max(2,Math.round(100*e.touches/maxH))+'%"></i></div>':'')
        +(t.gate_report?'<div style="margin-top:7px;font-size:11.5px;color:var(--warn)">gate: '
          +esc(t.gate_report.join(' | ')).slice(0,140)+'</div>':'');
      c.addEventListener('dragstart',function(ev){ev.dataTransfer.setData('text',t.id)});
      c.addEventListener('click',function(){openPeek(t)});
      body.appendChild(c);
    });
    lane.addEventListener('dragover',function(e){e.preventDefault();lane.classList.add('drag')});
    lane.addEventListener('dragleave',function(){lane.classList.remove('drag')});
    lane.addEventListener('drop',function(e){
      e.preventDefault();lane.classList.remove('drag');
      var id=e.dataTransfer.getData('text');
      fetchJSON('/tracks/'+id+'/lane',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({lane:L[0]})}).then(function(res){
          if(res&&res.gate_failed)
            toast('Gate failed — bounced: '+(res.gate_report||[]).map(function(p){return p.split('\n')[0]}).join(' | '),5200);
          else toast(L[0]==='working'?'Dispatched — session starting':L[0]==='review'?'Gate green — submitted':L[0]==='done'?'Accepted':'Queued');
          setTimeout(load,600)});
    });
    b.appendChild(lane);
  });
}

/* ---------- peek ---------- */
function openPeek(t){cur=t;
  $('p-id').textContent=t.branch+' · '+t.id;
  $('p-title').textContent=t.task;
  var st=STATUS[t.status]||[t.status,''];var e=econOf(t);
  $('props').innerHTML=
    '<span class=k>State</span><span><span class=chip><span class=sdot style="background:'+st[1]+'"></span>'+st[0]+'</span></span>'
    +'<span class=k>Repo</span><span style="font-size:12px">'+esc(t.repo)+'</span>'
    +'<span class=k>Session</span><span style="font-size:12px">'+(t.session_id||'not started')+'</span>'
    +'<span class=k>Driver</span><span style="font-size:12px">'+esc(t.driver||'claude')+'</span>'
    +(e?'<span class=k>Economics</span><span>€'+e.value+' · AI $'+e.ai_cost.toFixed(2)+' · '+e.touches
      +' touches'+(e.mode?' · '+e.mode:'')+'</span>'
      +'<span class=k>Tokens</span><span>'+e.tokens_in+' in / '+e.tokens_out+' out'
      +(e.models.length?' · '+esc(e.models.join(', ')):'')+'</span>':'');
  $('backdrop').style.display='block';$('peek').classList.add('open');
  fetchJSON('/tracks/'+t.id+'/history').then(function(h){
    $('feed').innerHTML=h.map(function(r){
      if(r.kind==='steer')return '<div class=f-steer>'+esc(r.detail)+'</div>';
      if(r.kind==='reply')return '<div class=f-reply>'+esc(r.detail)+'</div>';
      return '<div class=f-note>'+esc(r.detail)+'</div>';}).join('');
    $('feed').scrollTop=$('feed').scrollHeight;});
}
function closePeek(){$('peek').classList.remove('open');$('backdrop').style.display='none';cur=null}
function sendSteer(){var v=$('steer-box').value.trim();if(!v||!cur)return;
  fetchJSON('/tracks/'+cur.id+'/steer',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:v})}).then(function(){
      $('steer-box').value='';toast('Steer sent — session resuming');
      setTimeout(function(){if(cur)openPeek(cur);load()},1500)})}

/* ---------- new request ---------- */
var EXAMPLES=[
  {label:'🐛 bug fix',task:'Fix: the dashboard capacity gauge shows 0% when touch budget is 0 — guard the division and show a hint instead.',driver:'claude'},
  {label:'✨ feature',task:'Add a CSV export button to the dashboard work table (all columns, current filters applied).',driver:'claude'},
  {label:'🖥 desktop task',task:'Open the invoice tool, export June as PDF into Downloads, and verify the file exists.',driver:'claude-desktop'},
  {label:'🌐 browser task',task:'Go to the supplier portal, download the latest price list, and summarize what changed vs the file in data/prices.csv.',driver:'claude-desktop'},
  {label:'🔍 research',task:'Read the three competitor changelogs linked in docs/watchlist.md and write a one-page summary of what shipped this month.',driver:'claude'}];
function openModal(){
  var ex=$('m-examples');ex.innerHTML='';
  EXAMPLES.forEach(function(e){
    var b=document.createElement('button');b.className='btn ghost';b.style.cssText='font-size:11px;padding:2px 9px';
    b.textContent=e.label;b.title=e.task;
    b.addEventListener('click',function(){$('m-task').value=e.task;
      if($('m-driver'))$('m-driver').value=e.driver;$('m-task').focus()});
    ex.appendChild(b)});
  $('m-followup').style.display='none';fileArmed=false;
  var sel=$('m-driver');
  if(met&&met.settings&&met.settings.drivers){
    var cur2=sel.value;sel.innerHTML='';
    Object.keys(met.settings.drivers).forEach(function(k){
      var o=document.createElement('option');o.value=k;
      var d=met.settings.drivers[k];
      o.textContent='driver: '+k+(d.record?' (screen-recorded)':'')+(d.type!=='claude'?' ['+d.type+']':'');
      sel.appendChild(o)});
    if(cur2)sel.value=cur2;
  }
  $('modal').classList.add('open');$('m-task').focus()}
function closeModal(){$('modal').classList.remove('open')}
var fileArmed=false;
function fileReq(){
  var task=$('m-task').value.trim();if(!task){toast('Describe the task');return}
  // follow-up pass: catch what the dashboard would otherwise fill with defaults
  if(!fileArmed){
    var asks=[];
    if(task.length<25)asks.push('the task is very short — an agent works better with a sentence of context (what, where, what does done look like)');
    if(!$('m-value').value.trim())asks.push('no value set — dashboard will use the €'+((met&&met.settings)?met.settings.value_per_card:50)+' default (margin/ROI will be generic)');
    if(!$('m-due').value)asks.push('no due date — the card won’t show risk on the timeline');
    if(asks.length){
      fileArmed=true;
      $('m-followup').style.display='block';
      $('m-followup').innerHTML='<b style="color:var(--warn)">Before filing:</b><ul style="margin:4px 0 4px 16px;padding:0">'
        +asks.map(function(a){return '<li>'+a+'</li>'}).join('')
        +'</ul>Fill them above, or click <b>File to Backlog</b> again to file as-is.';
      if(!$('m-value').value.trim())document.querySelectorAll('.advrow').forEach(function(r){r.classList.add('show')});
      return;
    }
  }
  var body={task:task,lane:'backlog',priority:$('m-priority').value,due:$('m-due').value};
  if($('m-repo').value.trim())body.repo=$('m-repo').value.trim();
  if($('m-branch').value.trim())body.branch=$('m-branch').value.trim();
  if($('m-value').value.trim())body.value=parseFloat($('m-value').value);
  if($('m-driver').value)body.driver=$('m-driver').value;
  fetchJSON('/tracks/new',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)}).then(function(r){
      if(r.error){toast(r.error,4000);return}
      closeModal();$('m-task').value='';$('m-due').value='';$('m-priority').value='medium';
      fileArmed=false;toast('Filed to Backlog');load()})}

/* ---------- dashboard ---------- */
function renderDash(){
  if(!met){$('content').innerHTML='<div class=panel>no access</div>';return}
  var m=met,cur=(m.settings&&m.settings.currency)==='USD'?'$':'€';
  var y=m.yield_first_pass,a=m.automation,T=m.totals,c=m.capacity;
  var pct=Math.min(100,Math.round(100*c.touches_today/(c.touch_budget_day||1)));
  var tiles=[[cur+T.value_delivered,'value delivered'],['$'+T.ai_spend.toFixed(2),'AI spend'],
    [cur+T.margin,'margin (value − AI)'],
    [y[1]?Math.round(100*y[0]/y[1])+'%':'—','first-pass yield ('+y[0]+'/'+y[1]+')'],
    [a[1]?Math.round(100*a[0]/a[1])+'%':'—','automation rate ('+a[0]+'/'+a[1]+' auto)'],
    [cur+T.leverage_per_touch,'value per touch unit']];
  var h='<div id=tiles>'+tiles.map(function(t){
    return '<div class=tile><div class=v>'+t[0]+'</div><div class=l>'+t[1]+'</div></div>'}).join('')+'</div>';
  h+='<div class=panel><h3>Capacity — take more work, or automate?</h3>'
    +'<div style="font-size:12.5px;color:var(--txt-secondary)">today '+c.touches_today+'/'+c.touch_budget_day
    +' touch units ('+pct+'%) · WIP '+c.wip+'/'+c.wip_limit+' · headroom <b style="color:var(--ok)">'+c.headroom+' cards</b></div>'
    +'<div class=meter><i style="width:'+pct+'%"></i></div>'
    +(c.actors&&Object.keys(c.actors).length>1?'<div style="font-size:12px;color:var(--txt-secondary);margin:4px 0">'
      +Object.keys(c.actors).map(function(a){return esc(a)+': '+c.actors[a]+'t'}).join(' · ')+'</div>':'')
    +'<div style="font-size:11.5px;color:var(--txt-tertiary)">'
    +(pct<80&&c.headroom>0?'Below capacity → intake more: marginal cost of one more card is tokens only.'
      :'At capacity → automate: fixing the top gate failure below frees the most headroom.')+'</div></div>';
  h+='<div class=panel><h3>Gate failures — what to fix in the harness next</h3>';
  if(!m.gate_failures.length)h+='<div style="color:var(--txt-tertiary);font-size:12.5px">none recorded yet</div>';
  else{var mx=m.gate_failures[0][1];
    h+=m.gate_failures.map(function(kv){return '<div class=hbar><div class=lbl title="'+esc(kv[0])+'">'+esc(kv[0])
      +'</div><div class=trk><i style="width:'+Math.max(3,Math.round(100*kv[1]/mx))+'%"></i></div><div class=n>'+kv[1]+'</div></div>'}).join('')}
  h+='</div>';
  var maxA=0.01,maxH=1;m.cards.forEach(function(x){if(x.ai_cost>maxA)maxA=x.ai_cost;if(x.touches>maxH)maxH=x.touches});
  h+='<div class=panel><h3>Work done — <span style="color:var(--ai)">■</span> AI ($) · <span style="color:var(--human)">■</span> human (touch units)</h3>'
    +'<div style="overflow-x:auto"><table><tr><th>card</th><th>lane</th><th>model</th><th class=num>tok in/out</th>'
    +'<th class=num>AI $</th><th class=num>touches</th><th>split</th><th class=num>value</th><th class=num>margin</th><th>mode</th></tr>'
    +m.cards.map(function(x){
      var wa=Math.max(2,Math.round(100*x.ai_cost/maxA)),wh=Math.max(2,Math.round(100*x.touches/maxH));
      return '<tr><td>'+esc(x.task)+'</td><td>'+x.lane+'</td><td>'+esc((x.models[0]||'—').replace('claude-',''))
      +'</td><td class=num>'+x.tokens_in+'/'+x.tokens_out+'</td><td class=num>'+x.ai_cost.toFixed(2)
      +'</td><td class=num>'+x.touches+'</td><td><span class=msplit><i style="background:var(--ai);width:'+wa+'%"></i>'
      +'<i style="background:var(--human);width:'+wh+'%;margin-top:2px"></i></span></td><td class=num>'+cur+x.value
      +'</td><td class=num>'+cur+(x.value-x.ai_cost).toFixed(2)+'</td><td>'+(x.mode||'—')+'</td></tr>'}).join('')
    +'</table></div></div>';
  $('content').innerHTML=h;
}

/* ---------- recordings ---------- */
function renderRecs(){
  var host=$('content');
  host.innerHTML='<div style="color:var(--txt-tertiary);font-size:12.5px">loading…</div>';
  fetchJSON('/runs').then(function(runs){
    if(!runs.length){host.innerHTML='<div class=panel style="max-width:560px">'
      +'<h3>No recordings yet</h3><div style="font-size:12.5px;color:var(--txt-secondary)">'
      +'Record a demo (<b>swarm.py teach</b>), run a task, or dispatch a card — every agent run lands here '
      +'as a step timeline with drill-down video.</div></div>';return}
    host.innerHTML=runs.map(function(m,i){
      return '<div class=run data-id="'+esc(m.id)+'">'
        +'<div class="run-h" data-i="'+i+'"><span class=rkind>'+esc(m.kind)+'</span>'
        +'<span class=rt>'+esc(m.title)+'</span>'
        +'<span class=rm>'+esc(m.id)+' · '+esc(m.status)+' · '+(m.steps||0)+' steps</span>'
        +'<span class=chev>▸</span></div>'
        +'<div class=run-body></div></div>'}).join('');
    host.querySelectorAll('.run-h').forEach(function(h){
      h.addEventListener('click',function(){
        var run=h.parentElement,body=run.querySelector('.run-body');
        if(run.classList.toggle('open')&&!body.dataset.loaded){
          body.dataset.loaded='1';
          var id=run.dataset.id;
          fetchJSON('/runs/'+id+'/timeline').then(function(tl){
            body.innerHTML='<ul class=steps>'+tl.map(function(s){
              return '<li'+(s.kind==='flag'?' class=flag':'')+'><span class=st>'+s.t.toFixed(1)+'s</span>'
                +'<span class=sk>'+esc(s.kind)+'</span><span>'+esc(s.detail)+'</span>'}).join('')+'</ul>'
              +'<video controls preload=none src="/runs/'+id+'/video"></video>';
          }).catch(function(){body.innerHTML='<div style="color:var(--txt-tertiary)">no timeline</div>'});
        }});
    });
  });
}

/* ---------- settings ---------- */
function renderSettings(){
  var s=met.settings;
  $('content').innerHTML='<div id=settings><div class=panel><h3>Business settings</h3>'
    +'<label>Default repo (tickets need no path when set)</label><input id=s-repo value="'+esc(s.default_repo||'')+'">'
    +'<label>Value per card ('+s.currency+')</label><input id=s-value type=number value="'+s.value_per_card+'">'
    +'<label>WIP limit</label><input id=s-wip type=number value="'+s.capacity.wip_limit+'">'
    +'<label>Touch budget / day</label><input id=s-budget type=number value="'+s.capacity.touch_budget_day+'">'
    +'<label>Touch tariff (steer / review / bounce)</label>'
    +'<div style="display:flex;gap:8px"><input id=s-t1 type=number value="'+s.capacity.tariff.steer+'">'
    +'<input id=s-t2 type=number value="'+s.capacity.tariff.review+'">'
    +'<input id=s-t3 type=number value="'+s.capacity.tariff.bounce+'"></div>'
    +'<div style="margin-top:14px"><button class="btn primary" onclick="saveSettings()">Save</button></div>'
    +'</div>'
    +(ME&&ME.role==='owner'?'<div class=panel id=userspanel><h3>Users</h3><div id=userslist style="font-size:12.5px;color:var(--txt-tertiary)">loading…</div>'
      +'<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">'
      +'<input id=u-name placeholder="username" style="width:130px"><input id=u-pw type=password placeholder="password (8+)" style="width:150px">'
      +'<select id=u-role><option>operator</option><option>client</option><option>owner</option></select>'
      +'<button class="btn primary" onclick="addUser()">Add user</button></div>'
      +'<h3 style="margin-top:20px">Registration</h3>'
      +'<div style="font-size:12px;color:var(--txt-tertiary);margin-bottom:8px">Lets people create their own account on the sign-in screen. Share the invite code; new accounts get the default role.</div>'
      +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
      +'<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;margin:0"><input type=checkbox id=r-open'+((met.settings.registration||{}).open?' checked':'')+'> open (no code needed)</label>'
      +'<input id=r-code placeholder="invite code (empty = registration off)" style="width:220px" value="'+esc((met.settings.registration||{}).invite_code||'')+'">'
      +'<button class="btn ghost" onclick="$(\'r-code\').value=Math.random().toString(36).slice(2,10)">generate</button>'
      +'<select id=r-role>'+['client','operator'].map(function(r){return '<option'+(r===((met.settings.registration||{}).default_role||'client')?' selected':'')+'>'+r+'</option>'}).join('')+'</select>'
      +'<button class="btn primary" onclick="saveReg()">Save registration</button></div>'
      +'</div>':'')
    +'</div>';
  if(ME&&ME.role==='owner')loadUsers();
}
function loadUsers(){
  fetchJSON('/users').then(function(us){
    var el=$('userslist');if(!el)return;
    el.innerHTML='<table><tr><th>user</th><th>role</th><th>device tokens</th><th></th></tr>'
      +us.map(function(u){
        return '<tr><td><b>'+esc(u.name)+'</b><div style="font-size:10.5px;color:var(--txt-tertiary)">'+esc(u.created||'')+'</div></td>'
        +'<td><select onchange="setRole(\''+u.name+'\',this.value)">'
          +['owner','operator','client'].map(function(r){return '<option'+(r===u.role?' selected':'')+'>'+r+'</option>'}).join('')+'</select></td>'
        +'<td>'+(u.tokens||[]).map(function(t){
            return '<div style="display:flex;gap:6px;align-items:center;margin:2px 0"><span class=chip title="'+esc(t.token)+'">'+esc(t.label)+' · …'+esc(t.token.slice(-6))+'</span>'
            +'<button class="btn ghost" style="padding:0 7px;font-size:11px" onclick="revokeTok(\''+u.name+'\',\''+t.token+'\')">revoke</button></div>'}).join('')
          +'<button class="btn ghost" style="padding:1px 8px;font-size:11px;margin-top:3px" onclick="newTok(\''+u.name+'\')">+ token</button></td>'
        +'<td style="text-align:right"><button class="btn ghost" style="font-size:11px" onclick="resetPw(\''+u.name+'\')">reset pw</button> '
        +'<button class="btn ghost" style="font-size:11px;color:var(--danger);border-color:var(--danger)" onclick="delUser(\''+u.name+'\')">delete</button></td></tr>'})
      .join('')+'</table>';
  });
}
function post(u,b){return fetchJSON(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})})}
function saveReg(){
  post('/settings',{registration:{open:$('r-open').checked,invite_code:$('r-code').value.trim(),
    default_role:$('r-role').value}}).then(function(){toast('Registration settings saved');load()})}
function addUser(){
  post('/users',{name:$('u-name').value.trim(),password:$('u-pw').value,role:$('u-role').value})
  .then(function(r){if(r.error){toast(r.error,3600);return}
    toast('User created');$('u-name').value='';$('u-pw').value='';loadUsers()})}
function setRole(n,r){post('/users/'+n+'/role',{role:r}).then(function(x){toast(x.error||'Role updated');loadUsers()})}
function resetPw(n){var p=prompt('New password for '+n+' (8+ chars):');if(!p)return;
  post('/users/'+n+'/password',{password:p}).then(function(x){toast(x.error||'Password set')})}
function newTok(n){var l=prompt('Token label (e.g. glasses, apk):','device');if(l===null)return;
  post('/users/'+n+'/tokens',{label:l}).then(function(x){
    if(x.error){toast(x.error,3600);return}
    prompt('Device token for '+n+' — copy it now (shown once here, also visible to owner in this panel):',x.token);loadUsers()})}
function revokeTok(n,t){post('/users/'+n+'/revoke',{token:t}).then(function(){toast('Token revoked');loadUsers()})}
function delUser(n){if(!confirm('Delete user '+n+'? Their sessions and tokens die immediately.'))return;
  post('/users/'+n+'/delete').then(function(x){toast(x.error||'User deleted');loadUsers()})}
function saveSettings(){
  fetchJSON('/settings',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({default_repo:$('s-repo').value.trim(),
      value_per_card:parseFloat($('s-value').value)||50,
      capacity:{wip_limit:parseInt($('s-wip').value)||6,
        touch_budget_day:parseInt($('s-budget').value)||30,
        tariff:{steer:+$('s-t1').value||1,review:+$('s-t2').value||1,bounce:+$('s-t3').value||3}}})})
  .then(function(){toast('Settings saved');load()});
}

/* ---------- nav / theme ---------- */
document.querySelectorAll('.navitem[data-view]').forEach(function(n){
  n.addEventListener('click',function(){view=n.dataset.view;location.hash=view;render()})});
document.querySelectorAll('.lay').forEach(function(l){
  l.addEventListener('click',function(){view=l.dataset.lay;location.hash=view;render()})});
if(/^#(board|list|timeline|dash|recs|settings)$/.test(location.hash))view=location.hash.slice(1);
window.addEventListener('hashchange',function(){
  if(/^#(board|list|timeline|dash|recs|settings)$/.test(location.hash)){view=location.hash.slice(1);render()}});
document.querySelectorAll('.navitem[data-filter]').forEach(function(n){
  n.addEventListener('click',function(){view='board';filter=n.dataset.filter;render()})});
$('themebtn').addEventListener('click',function(){
  var r=document.documentElement;
  r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';
  try{localStorage.sdTheme=r.dataset.theme}catch(e){}});
try{if(localStorage.sdTheme)document.documentElement.dataset.theme=localStorage.sdTheme}catch(e){}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closePeek();closeModal()}
  if(e.key==='c'&&!e.ctrlKey&&!e.metaKey&&view==='board'
     &&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))openModal();
});
load();setInterval(load,5000);
</script>
</body>
</html>
