# Build the Developer-ID signed, notarized, stapled DMG of the TAURI desktop shell (direct download) on a
# real macOS runner. The twin of desktop-mac-mas-tauri.yml (App Store .pkg) and the successor of desktop-mac.yml
# (Electron). workflow_dispatch ONLY. Publishing (release assets + the tauri-feed latest.json) is a separate,
# deliberate step on the owner's PC: ops/deploy/release_tauri_mac.py - the updater signing key lives only there.
#
# Repository secrets (shared with desktop-mac.yml; ONE Developer ID certificate, valid to 2031):
#   MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD   Developer ID Application .p12 (base64) + password
#   ASC_API_KEY_P8 / ASC_KEY_ID / ASC_ISSUER_ID   App Store Connect API key for notarytool
name: desktop-mac-tauri

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (x.y.z)"
        required: true

concurrency:
  group: desktop-mac-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: surfaces/app/package-lock.json

      - name: Rust (both mac architectures for the universal binary)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo install tauri-cli --version "^2" --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            surfaces/desktop/tauri-app/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('surfaces/desktop/tauri-app/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-tauri-

      - name: Install app dependencies
        run: cd surfaces/app && npm ci

      - name: Signing keychain + notarization key (throw-away, this job only)
        env:
          P12: ${{ secrets.MAC_CSC_LINK }}
          P12_PW: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/helmdeck-signing.keychain-db"
          KC_PW="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/devid.p12"
          IDENT="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          test -n "$IDENT" || { echo "no Developer ID Application identity in the certificate"; exit 1; }
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "APPLE_SIGNING_IDENTITY=$IDENT"
            echo "APPLE_API_KEY=$ASC_KEY_ID"
            echo "APPLE_API_ISSUER=$ASC_ISSUER_ID"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple, assess
        run: python3 ops/deploy/build_devid_tauri.py --version "${{ inputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: helmdeck-macos-tauri
          if-no-files-found: error
          retention-days: 14
          path: surfaces/desktop/tauri-app/target/devid/*

      - name: Remove the keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/helmdeck-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
