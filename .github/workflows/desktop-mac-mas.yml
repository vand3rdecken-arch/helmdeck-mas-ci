# Build the HelmDeck Mac App Store .pkg on a real macOS runner.
#
# workflow_dispatch ONLY - unlike desktop-mac.yml this never runs on a push.
# A mas build is not meaningful unsigned (Apple's installer refuses an
# unsigned .pkg outright), so a run with the signing secrets missing would
# just fail every time surfaces/desktop/** changes - noise, not signal, until the
# owner has actually minted the Mac App Distribution / Mac Installer
# Distribution certs and a MAC_APP_STORE provisioning profile (DEPLOY.md 1f).
#
# Required repository secrets (none of these overlap with desktop-mac.yml's -
# a mas build needs its OWN cert pair, not the Developer ID one):
#   MAC_MAS_CSC_LINK / MAC_MAS_CSC_KEY_PASSWORD                    Mac App Distribution .p12
#   MAC_MAS_INSTALLER_CSC_LINK / MAC_MAS_INSTALLER_CSC_KEY_PASSWORD Mac Installer Distribution .p12
#   MAC_MAS_PROVISIONING_PROFILE_B64                                base64 of the .provisionprofile
name: desktop-mac-mas

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (blank = surfaces/desktop/package.json)"
        required: false
        default: ""
      release_tag:
        description: "Attach the .pkg set to this (pre-existing) release tag instead of Actions artifact storage - see desktop-mac.yml's 2026-09-10 note: the artifact-quota counter can read full while real usage is ~0, and that must not block delivery"
        required: false
        default: ""

concurrency:
  group: desktop-mac-mas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write        # only used by the optional release-upload step
    env:
      CSC_LINK: ${{ secrets.MAC_MAS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_MAS_CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.MAC_MAS_INSTALLER_CSC_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAC_MAS_INSTALLER_CSC_KEY_PASSWORD }}
      EXPO_NO_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            surfaces/app/package-lock.json
            surfaces/desktop/package-lock.json

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('surfaces/desktop/package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install app + desktop dependencies
        run: |
          (cd surfaces/app && npm ci)
          (cd surfaces/desktop && npm ci)

      - name: Stage the provisioning profile
        if: env.MAC_MAS_PROVISIONING_PROFILE_B64 != ''
        env:
          MAC_MAS_PROVISIONING_PROFILE_B64: ${{ secrets.MAC_MAS_PROVISIONING_PROFILE_B64 }}
        run: |
          mkdir -p surfaces/desktop/build
          printf '%s' "$MAC_MAS_PROVISIONING_PROFILE_B64" | base64 --decode \
            > surfaces/desktop/build/embedded.provisionprofile

      - name: Build (.pkg, arm64 + x64)
        run: bash surfaces/desktop/build-mas.sh ${{ inputs.version && format('--version {0}', inputs.version) || '' }}

      - name: Debug - release tree (only on failure, diagnoses a missing .pkg)
        if: failure()
        run: find surfaces/desktop/release -maxdepth 4 2>&1 || echo "(no release dir)"

      # the mas target nests its .pkg under a per-arch appOutDir
      # (release/mas/, release/mas-arm64/), unlike dmg/zip which electron-
      # builder flattens into release/ - measured 2026-09-10, glob accordingly.
      - name: Verify the artifact set
        run: |
          cd surfaces/desktop/release
          find . -maxdepth 2 -name '*.pkg'
          missing=0
          for pat in "mas*/*-arm64.pkg" "mas*/*-x64.pkg"; do
            # shellcheck disable=SC2086
            if ! compgen -G "$pat" > /dev/null; then echo "!!! missing: $pat"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1

      # Two alternative transports, never both (same discipline as
      # desktop-mac.yml): a dispatch that attaches to a release has no use
      # for a second copy in Actions artifact storage, and the release path
      # must not depend on that store being writable - its quota counter can
      # read full while real usage is ~0 (measured 2026-09-10).
      #
      # Neither transport touches App Store Connect. Uploading there is a
      # separate, deliberate step (xcrun altool / Transporter) the owner
      # runs by hand once he has a Mac for sandbox testing.
      - uses: actions/upload-artifact@v4
        if: inputs.release_tag == ''
        with:
          name: helmdeck-macos-mas
          if-no-files-found: error
          retention-days: 7
          path: surfaces/desktop/release/mas*/*.pkg

      - name: Attach to a release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" --clobber \
            surfaces/desktop/release/mas/*.pkg surfaces/desktop/release/mas-arm64/*.pkg
