<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="HelmDeck auf der Meta Ray-Ban Display: Henry als Hauptansicht, dahinter das Board.">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>HelmDeck · Henry</title>
  <!-- the same four things Herald ships per app: svg icon, 256px png, manifest, links -->
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" sizes="256x256" href="/favicon.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#7A62E6">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- HENRY - the main surface, like the phone app's first tab (owner
         2026-10-07: "Henry als Mainchat, Boards dahinter, genauso aufgebaut wie
         die App"). The conversation fills the lens; the microphone is ONE pill in
         the header, a glyph and a pulsing ring, never a sentence: it listens as
         soon as the app opens and says so with a tone. The screen id stays
         `talk` - the conversation machinery below keys on it. -->
    <div id="talk" class="screen">
      <header class="header">
        <span class="brand"><svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z"/></svg>Henry</span>
        <span class="header-meta" id="conn-dot" title="Verbindung">•</span>
        <span class="header-meta" id="talk-meta"></span>
      </header>
      <div class="content scrollable" id="talk-scroll">
        <div class="chat" id="talk-chat"></div>
        <div class="list-container" id="talk-options"></div>
      </div>
      <!-- Only for the states that need a WORD (Henry works, a draft waits, a
           turn failed): a dot AND a word, because colour alone is forbidden on
           this display. Listening and idle show nothing here - the orb says it. -->
      <div class="turnbar hidden" id="turnbar">
        <span class="turn-dot" id="turn-dot" aria-hidden="true"></span>
        <span class="turn-label" id="turn-label"></span>
      </div>
      <!-- THE RAIL: Board - the Sprechen orb - Mehr. The orb is the primary action:
           always here, focused first; the ring pulses while the phone listens and
           the glyph becomes a stop square (Enter = Stopp). -->
      <nav class="rail">
        <button class="rail-btn focusable" data-action="tab" data-tab="board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg><span>Board</span><i class="badge-dot hidden" aria-hidden="true"></i></button>
        <!-- THE COMPOSER FIELD. A plain text field: when the owner targets it and presses
             Enter, the glasses open THEIR OWN composer (dictation, Neural Handwriting,
             on-screen keyboard - Meta docs, "Text input", firmware v127+). The text comes
             back as an ordinary change event; no SDK, no permission, no phone service.
             Drawn as the round Sprechen orb: the glyph sits ON the transparent field. -->
        <div class="orb-wrap"><div class="orb-field"><svg class="ic-mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg><input class="orb focusable" id="speak" data-primary="1" type="search" enterkeyhint="send" autocomplete="off" placeholder="Sprechen oder schreiben" aria-label="Sprechen oder schreiben"></div><span id="speak-label" class="orb-label">Sprechen · Schreiben</span></div>
        <button class="rail-btn focusable" data-action="tab" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span>Mehr</span></button>
      </nav>
    </div>

    <!-- BOARD - the overview behind Henry: what waits on the owner. One number,
         then the cards. No money, no capacity table: the phone's board tab is
         the place for that. -->
    <div id="board" class="screen hidden">
      <header class="header">
        <span class="brand">Board</span>
        <span class="header-meta" id="needs-count"></span>
      </header>
      <div class="content">
        <div class="hero">
          <div class="hero-num" id="needs-num">–</div>
          <div class="hero-label" id="needs-label">warten auf dich</div>
          <div class="hero-sub" id="needs-age"></div>
        </div>
        <div class="list-container" id="needs-list"></div>
      </div>
      <nav class="tabs">
        <button class="tab focusable" data-action="tab" data-tab="talk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg><span>Henry</span></button>
        <button class="tab focusable on" data-action="tab" data-tab="board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg><span>Board</span></button>
        <button class="tab focusable" data-action="tab" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span>Mehr</span></button>
      </nav>
    </div>

    <!-- MEHR - listening, voice, connection. -->
    <div id="more" class="screen hidden">
      <header class="header">
        <span class="brand">Mehr</span>
      </header>
      <div class="content">
        <div class="list-container">
          <button class="list-item focusable" data-action="talk-speak">
            <div class="li-task">Mit dem Handy sprechen</div>
            <div class="li-sub">öffnet das Handy-Mikrofon, falls der Brillen-Dienst läuft</div>
          </button>
          <button class="list-item focusable" data-action="toggle-autolisten">
            <div class="li-task">Handy-Mikrofon beim Öffnen</div>
            <div class="li-sub" id="autolisten-state">an</div>
          </button>
          <button class="list-item focusable" data-action="voice-toggle">
            <div class="li-task">Henry spricht</div>
            <div class="li-sub" id="voice-state">an</div>
          </button>
          <button class="list-item focusable" data-action="voice-repeat">
            <div class="li-task">Letzte Ansage wiederholen</div>
          </button>
          <button class="list-item focusable" data-action="open-settings">
            <div class="li-task">Verbindung</div>
            <div class="li-sub">Adresse und Token</div>
          </button>
        </div>
      </div>
      <nav class="tabs">
        <button class="tab focusable" data-action="tab" data-tab="talk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg><span>Henry</span></button>
        <button class="tab focusable" data-action="tab" data-tab="board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg><span>Board</span><span class="badge-dot hidden" aria-hidden="true"></span></button>
        <button class="tab focusable on" data-action="tab" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span>Mehr</span></button>
      </nav>
    </div>

    <!-- Card detail -->
    <div id="detail" class="screen hidden">
      <header class="header">
        <button class="back-btn focusable" data-action="back">&#8592;</button>
        <span class="brand">Karte</span>
      </header>
      <div class="content">
        <div class="detail-task" id="detail-task">–</div>
        <div class="detail-meta" id="detail-meta"></div>
      </div>
      <nav class="nav-bar hidden" id="detail-nav">
        <button class="nav-item focusable primary" data-action="open-decide">Entscheiden</button>
      </nav>
    </div>

    <!-- GLASS MODE: the decision itself. One question fills the lens; the
         options are the only input, because the lens cannot type. -->
    <div id="decide" class="screen hidden">
      <header class="header">
        <button class="back-btn focusable" data-action="back">&#8592;</button>
        <span class="brand" id="decide-head">Entscheiden</span>
        <span class="header-meta" id="decide-step"></span>
      </header>
      <div class="content">
        <div class="decide-q" id="decide-q">–</div>
        <div class="list-container" id="decide-options"></div>
      </div>
    </div>

    <!-- Connection -->
    <div id="settings" class="screen hidden">
      <header class="header">
        <button class="back-btn focusable" data-action="back">&#8592;</button>
        <span class="brand">Verbindung</span>
      </header>
      <div class="content">
        <label class="field-label" for="cfg-base">Adresse des Daemons (optional)</label>
        <input id="cfg-base" class="field focusable" type="url" inputmode="url"
          placeholder="leer = dieser Server" autocomplete="off">
        <label class="field-label" for="cfg-token">Glance-Token</label>
        <input id="cfg-token" class="field focusable" type="text"
          placeholder="aus den Einstellungen einfügen" autocomplete="off">
        <div class="field-hint">Den Token legt der Owner in den HelmDeck-Einstellungen fest.
          Adresse leer lassen, wenn der Glance-Worker diese App ausliefert.</div>
      </div>
      <nav class="nav-bar">
        <button class="nav-item focusable primary" data-action="save-settings">Speichern &amp; verbinden</button>
      </nav>
    </div>

    <!-- transient status line -->
    <div id="toast" class="toast hidden"></div>

    <!-- proactive notification: a NEW needs_you blocker landed while the
         owner was looking at something else. Count only, no card content -
         glance-safe for a bystander (see app.js notifyBanner). -->
    <div id="notify-banner" class="notify-banner hidden" aria-hidden="true"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
