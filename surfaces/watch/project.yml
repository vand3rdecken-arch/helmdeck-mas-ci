name: HelmDeckWatch
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  # A minimal, near-empty iOS app. Its only job is to carry the watch app to
  # the App Store/TestFlight (Apple's embedding requirement) - the watch app
  # talks to the relay directly (own APNs token, no WatchConnectivity), so
  # this host has no business logic and never will (ops/docs/backlog/
  # watchos-technik-machbarkeit/README.md SS3).
  HelmDeckWatchCompanion:
    type: application
    platform: iOS
    sources: [iOSHost]
    info:
      path: iOSHost/Info.plist
      properties:
        CFBundleDisplayName: HelmDeck Watch
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.helmdeck.watchcompanion
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: HelmDeckWatch
        embed: true

  HelmDeckWatch:
    type: application.watchapp2
    platform: watchOS
    sources: [Watch]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: HelmDeck
        WKCompanionAppBundleIdentifier: app.helmdeck.watchcompanion
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Watch/HelmDeckWatch.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.helmdeck.watchcompanion.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: false
