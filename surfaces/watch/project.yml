name: HelmDeckWatch
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

# SIGNING (measured across 4 CI runs, not reasoned): `xcodebuild archive`
# under CODE_SIGN_STYLE=Automatic requests an *Apple Development* identity -
# Xcode's model is "archive signs with Development, export re-signs with
# Distribution". A Development identity is exactly what an ephemeral CI Mac
# can never hold: automatic signing mints a cert whose private key lives in
# that runner's keychain and dies with it (and Apple caps Development certs
# at 2, so retries wedge the whole account). So Release signs MANUALLY with
# the team's Apple Distribution cert imported from a .p12 secret + named
# App Store profiles that build-watch.sh creates/fetches via fastlane sigh.
# Debug stays Automatic - it is only ever built unsigned in CI
# (CODE_SIGNING_ALLOWED=NO) or interactively on a real Mac.
settings:
  base:
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
  configs:
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"

targets:
  # A minimal, near-empty iOS app. Its only job is to carry the watch app to
  # the App Store/TestFlight (Apple's embedding requirement) - the watch app
  # talks to the relay directly (own APNs token, no WatchConnectivity), so
  # this host has no business logic and never will (ops/docs/backlog/
  # watchos-technik-machbarkeit/README.md SS3).
  HelmDeckWatchCompanion:
    type: application
    platform: iOS
    sources: [iOSHost]
    info:
      path: iOSHost/Info.plist
      properties:
        CFBundleDisplayName: HelmDeck Watch
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.helmdeck.watchcompanion
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: HelmDeckWatchCompanion AppStore
          # Target-level because XcodeGen's iOS-application preset injects
          # an sdk-conditional CODE_SIGN_IDENTITY[sdk=iphoneos*]="iPhone
          # Developer" at TARGET level - it beats the project-level Release
          # override, and the sdk-conditional form beats the plain form
          # (measured: "No signing certificate 'iOS Development' found"
          # during a Manual-signed archive, run 33965883995).
          CODE_SIGN_IDENTITY: Apple Distribution
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
    dependencies:
      - target: HelmDeckWatch
        embed: true

  HelmDeckWatch:
    # PLAIN application + WKApplication key = the modern single-target watch
    # app (Xcode 14+ template). NOT application.watchapp2: that is the legacy
    # two-part layout where the app binary is Apple's WatchKit STUB (copied
    # in by the build system) and code lives in a separate extension -
    # giving a watchapp2 target its own sources makes two commands produce
    # the same executable ("Multiple commands produce ... HelmDeckWatch",
    # measured run 33964479850).
    type: application
    platform: watchOS
    sources: [Watch]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: HelmDeck
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.helmdeck.watchcompanion
    # No aps-environment entitlement YET, deliberately: push wiring is a
    # follow-up card, and the entitlement forces a capability-enabled profile
    # - i.e. the known PUSH_NOTIFICATIONS capability-sync trap (DEPLOY.md,
    # commit 5eb6a5b) - for zero benefit while no push code exists. Re-add it
    # in the card that actually registers the watch's APNs token.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.helmdeck.watchcompanion.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: false
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: HelmDeckWatch AppStore
          # Same preset-override reasoning as the companion target above.
          CODE_SIGN_IDENTITY: Apple Distribution
          "CODE_SIGN_IDENTITY[sdk=watchos*]": Apple Distribution
