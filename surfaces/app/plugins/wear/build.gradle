// HelmDeck Wear OS module (W2a) - a SEPARATE installable app, not a build
// variant of the phone module. Classic (non-Kotlin-DSL) syntax to match how
// this hand-managed tree already writes build.gradle - see withMetaDat.js's
// patchAppGradle/patchRootGradle, which both target this exact dialect.
//
// kotlin-android needs no version suffix here because it is ALREADY on the
// root buildscript classpath - the phone module ships hand-installed Kotlin
// (GlassCameraService.kt, GlassesDevice.kt, GlassesRadio.kt, all built into
// production APKs by ops/deploy/build_apk.sh), so the Kotlin Gradle plugin is
// proven wired, not assumed. org.jetbrains.kotlin.plugin.compose is the ONE
// new classpath entry this card adds to the ROOT build.gradle (withWearApp.js
// patchRootGradleForCompose) - the documented trap (README.md §7.1): the
// Compose compiler plugin must be declared at the ROOT, applied per-module.
apply plugin: "com.android.application"
apply plugin: "kotlin-android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

// Release signing + package identity (W2, 2026-09-10, revised same day).
// OWNER DECISION: extend the EXISTING app.helmdeck Play listing with a Wear
// OS form factor rather than publish a second, separate listing. Confirmed
// against developer.android.com/training/wearables/packaging (fetched
// 2026-09-10): "If you have an existing mobile app, verify that you have
// used THE SAME PACKAGE NAME for your Wear OS app" - so applicationId below
// is "app.helmdeck", matching the phone module, NOT "app.helmdeck.wear"
// anymore. Android's package manager also requires every APK sharing one
// installed package to carry the SAME signing certificate, and Play's own
// upload flow verifies the upload signature against the certificate already
// registered for that app record - so this is signed with the PHONE
// module's own keystore (daemon/certs/apk-signing/swarmdeck-release.jks),
// not a dedicated Wear key. A same-signed-with-a-different-key upload to
// the same app.helmdeck listing would be rejected at upload time, not at
// review time.
//
// SUPERSEDES an earlier same-day decision (still in git history) to keep
// :wear as a fully separate app (own id app.helmdeck.wear, own keystore
// daemon/certs/apk-signing/helmdeck-wear-release.jks) for a standalone Play
// listing. That keystore still exists on disk (git-ignored, harmless) but
// nothing in the active build path reads it anymore - this file is the
// only source of truth for which identity :wear ships under.
//
// versionCode is INDEPENDENT of the phone's own sequence (currently ~91),
// per the same doc: "a watch APK's version code must be unique across all
// form factors... we recommend its version code scheme is independent of
// any other form factor" - starts at 1000001, a range that can never
// collide with the phone's low counter.
//
// Unlike android/app/build.gradle (Expo-generated, patched post-hoc by
// withReleaseSigning.js because prebuild --clean wipes hand edits), this
// file IS the source of truth - installWearModule() in withWearApp.js
// copies it byte-for-byte into android/wear/build.gradle on every build,
// so the loader below can live here directly. withWearReleaseSigning.js
// copies keystore.properties + release.keystore into android/wear/ before
// gradlew runs (secrets never live in this git-tracked file).
def wearReleaseSigningProps = new Properties()
def wearReleaseSigningPropsFile = file('keystore.properties')
if (wearReleaseSigningPropsFile.exists()) {
    wearReleaseSigningProps.load(new FileInputStream(wearReleaseSigningPropsFile))
}

android {
    namespace "app.helmdeck.wear"
    // targetSdk history: 34 had a citation (developer.android.com/training/
    // wearables/apps/standalone-apps, checked 2026-08-28: "For new apps, the
    // target API level must be 34 or higher") and compileSdk was raised to
    // 36 independently of it (2026-08-28 first real Gradle run needed 35+
    // for androidx.wear.compose et al, see git history for the exact errors).
    // SUPERSEDED 2026-09-10: Play's own release validator, on the actual
    // upload for the bundled-listing submission, rejected targetSdk 34 with
    // "Deine App ist ... auf API-Ebene 34 ausgerichtet, sollte jedoch eine
    // API-Mindestebene von 35 haben" - a live, current Play policy floor the
    // 2026-08-28 doc citation didn't capture (Google tightens this over
    // time). Raised to match compileSdk (36) rather than the bare 35, same
    // reasoning as the phone module: one platform, no second near-future
    // bump for a one-point gap.
    compileSdkVersion 36

    defaultConfig {
        // Matches the phone module's applicationId - see the header comment
        // above (2026-09-10 owner decision: bundled into the existing Play
        // listing, package name must match). namespace above stays
        // "app.helmdeck.wear" - that only names the generated R/BuildConfig
        // Kotlin package, Play/PackageManager never see it.
        applicationId "app.helmdeck"
        // Wear OS 3.0 (API 30) is the platform floor Google documents for a
        // Compose-based standalone app. NOT tied to the phone module's own
        // minSdk 24 - this is a different installable unit for different
        // hardware.
        minSdkVersion 30
        targetSdkVersion 36
        // Independent range from the phone's own versionCode (currently
        // ~91) - see header comment, cited from developer.android.com/
        // training/wearables/packaging. Bump this, never the phone's
        // counter, for a new Wear-only release.
        // 1000001 burned by the 2026-09-10 targetSdk-34 upload attempt -
        // Play rejects re-uploading a versionCode even when the earlier
        // attempt itself was never published ("wurde bereits verwendet").
        // 1000002 burned the same way: its Interner-Test release got
        // superseded by an abandoned Produktion draft mid-promotion, and
        // Play's "Add from library" picker then permanently excludes a
        // versionCode tied to any existing release record, live or not.
        // 1000003 burned 2026-09-11 the same way: staged into an abandoned
        // Produktion (Wear OS) draft (never published), which left it as
        // the track's remembered floor - Play then refused BOTH a re-submit
        // of 1000002 (downgrade) and a re-submit of 1000003 itself ("keine
        // App Bundles hinzugefuegt oder entfernt", since the track already
        // remembers that exact bundle) when promoting from Interner Test.
        // 1000004 was consumed 2026-09-11 by a saved-but-never-rolled-out
        // draft: the card pressed "Speichern" and then searched the release
        // DETAILS page for a submit control, which that page never has. The
        // "Release ueberpruefen" -> "Roll-out starten" button lives on the
        // TRACK page next to the newest draft. Uploading again afterwards hit
        // "wurde bereits verwendet", so the code is spent - 1000005 is the
        // bundle that must actually be rolled out.
        // 1000005 ging durch (Einreichung #11, 2026-09-11 21:51, "Wird
        // ueberprueft"). Die eigentliche Ursache war NIE der Versionscode,
        // sondern Erweiterte Einstellungen -> Formfaktoren: Wear OS stand auf
        // "2 von 3 erledigt", Punkt "Aktiviere deine App fuer Wear OS und
        // stimme der Richtlinie fuer Ueberpruefungen zu" war offen. Solange
        // der offen ist, nimmt Play den Wear-Produktions-Release NICHT in
        // "Veroeffentlichungen -> Uebersicht" auf, es gibt keinen Einreichen-
        // Button, und jedes gespeicherte Release kippt sofort auf "Durch
        // einen anderen Release ersetzt / Nicht veroeffentlicht". Punkt 3 ist
        // gesperrt, bis Wear-Screenshots in ALLEN Sprach-Store-Eintraegen
        // liegen UND der Listing-Entwurf gespeichert ist.
        // 1000006: rebuild carrying the four post-1000005 wear-chat fixes
        // (ee3761e0 backoff refresh, f06f8030/1e739c19 wake catch-up loading
        // state, 4f360250 HenryScreen ambient mode) - none of them were in
        // the vc1000005 bundle uploaded 2026-09-11.
        versionCode 1000006
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file(wearReleaseSigningProps.getProperty('storeFile', 'release.keystore'))
            storePassword wearReleaseSigningProps.getProperty('storePassword')
            keyAlias wearReleaseSigningProps.getProperty('keyAlias')
            keyPassword wearReleaseSigningProps.getProperty('keyPassword')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Every version below except activity-compose was fetched from
    // developer.android.com / central.sonatype.com this session (checked
    // 2026-08-28/29), not recalled:
    //   - androidx.wear.compose:compose-foundation:1.6.2 (stable, 2026-05-19)
    //   - androidx.wear.compose:compose-material3:1.5.0 (stable, 2025-08-27)
    //   - com.goterl:lazysodium-android:5.2.0 (Maven Central "latest stable")
    //   - net.java.dev.jna:jna:5.17.0 (lazysodium's own documented JNA pin)
    // activity-compose is the one unverified pin in this file - no fetch this
    // session confirmed it against Kotlin 2.1.20 (voice-interaction-
    // design.md:475's measured version for this app). Recheck against
    // Android Studio's own Wear OS Compose template before a real build.
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-compose:1.9.3"
    // registerForActivityResult (MainActivity.kt, the notification-permission
    // ask) trips lintVitalRelease's InvalidFragmentVersionForActivityResult
    // when the classpath's transitive androidx.fragment is < 1.3.0 (measured
    // 2026-08-29, first release build of this module). Pin it explicitly -
    // 1.6.2 is the same line the phone module resolves, compileSdk-36-safe;
    // same confidence tier as activity-compose above (not freshly fetched).
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    // Explicit rather than relying on Compose's transitive pull-in of
    // coroutines - PairingScreen.kt uses Dispatchers.IO/Default directly.
    // Same confidence tier as activity-compose above (not freshly fetched
    // this session; 1.9.x was the broadly-adopted line for Kotlin 2.0/2.1).
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "androidx.wear.compose:compose-foundation:1.6.2"
    implementation "androidx.wear.compose:compose-material3:1.5.0"

    // NaCl box (crypto/HelmDeckBox.kt) - an established libsodium JNI binding,
    // NOT hand-rolled primitives. This is the ONE dependency in this file
    // whose exact METHOD SURFACE (not just its version) is unverified this
    // session - see crypto/HelmDeckBox.kt's own header for what that means in
    // practice and why it is still the responsible choice.
    implementation "com.goterl:lazysodium-android:5.2.0@aar"
    implementation "net.java.dev.jna:jna:5.17.0@aar"

    // EncryptedSharedPreferences - Android Jetpack's own credential-at-rest
    // story (the Wear equivalent of expo-secure-store on the phone). Version
    // is the well-known 1.1.0-alpha06, the last release before this artifact
    // was folded into Credential Manager guidance; not re-fetched this
    // session, same confidence tier as activity-compose above.
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // W2d (2026-08-29): the watch's own FCM receiver (PushService.kt). Version
    // is NOT a guess - 25.0.1 is what the phone module already resolves to and
    // what is already in this machine's Gradle cache, so :wear and :app agree
    // on one Firebase line instead of dragging in a second.
    // The com.google.gms:google-services CLASSPATH already exists at the root
    // (android/build.gradle:11, 4.4.4) because :app uses it; only the per-module
    // `apply plugin` below is new. The plugin reads wear/google-services.json,
    // which now carries an app.helmdeck.wear client (registered 2026-08-29) -
    // without that entry it fails the build with "No matching client found".
    implementation "com.google.firebase:firebase-messaging:25.0.1"
}

apply plugin: 'com.google.gms.google-services'
