[package]
name = "helmdeck-desktop"
version = "0.1.0"
edition = "2021"
description = "HelmDeck desktop window in Tauri (prototype of the Electron shell in surfaces/desktop/main.js)"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
# the Run key login item (Windows only; a Store build uses the StartupTask below)
winreg = "0.56.0"
# the Store build's "start at login": Windows.ApplicationModel.StartupTask (WinRT)
windows = { version = "0.62", features = ["ApplicationModel"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
