[package]
name = "helmdeck-tray"
version = "0.1.0"
edition = "2021"
description = "HelmDeck system-tray supervisor (Rust prototype of surfaces/desktop/tray.py)"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
png = "0.18.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
tao = "0.37.1"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
winreg = "0.56.0"
