[package]
name = "helmdeck-relay-bridge"
version = "0.1.0"
edition = "2021"
description = "Rust data plane of the relay bridge (prototype of spine/comms/relay_client.py)"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
base64 = "0.23.1"
crypto_box = "0.9.1"
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = "3.4.2"
url = "2.5.8"
